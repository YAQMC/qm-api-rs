[package]
name = "qqmusic-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "A pure-Rust async client for QQ Music APIs, ported from the L-1124/QQMusicApi Python library and supplemented with the official desktop client."
license = "GPL-3.0-or-later"
keywords = ["qqmusic", "music", "api", "tencent"]
categories = ["web-programming::http-client"]

[lib]
name = "qqmusic_api"
path = "src/lib.rs"

[features]
# 未经过 live write 验证的写接口 (逆向自官方客户端 ASAR, 语义可能不准确).
# 默认关闭: 需要显式启用 `--features experimental` 才能调用,
# 避免把"源码中发现 endpoint"误认为"当前协议已验证".
experimental = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
async-trait = "0.1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
hex = "0.4"
rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
flate2 = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"

[[example]]
name = "demo"
path = "examples/demo.rs"

[profile.release]
lto = true
